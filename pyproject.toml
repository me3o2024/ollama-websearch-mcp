[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ollama-websearch-mcp"
version = "1.0.0"
description = "A small, resilient MCP server for Ollama Cloud web search and fetch."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohammed Hassan" }]
keywords = ["ollama", "mcp", "web-search", "litellm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
ollama-websearch-mcp = "ollama_websearch_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_websearch_mcp"]

[tool.pytest.ini_options]
addopts = "-q --cov=ollama_websearch_mcp --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

